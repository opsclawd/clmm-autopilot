name: devnet-e2e-manual

on:
  workflow_dispatch:

jobs:
  e2e-devnet:
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      AUTHORITY_KEYPAIR: /tmp/devnet-authority.json
      SWAP_ROUTER: noop
      FORCE_DECISION: TRIGGER_DOWN
      REQUIRE_RECEIPT_PROOF: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Write authority keypair
        run: |
          test -n "${{ secrets.AUTHORITY_KEYPAIR_JSON }}"
          printf '%s' '${{ secrets.AUTHORITY_KEYPAIR_JSON }}' > "$AUTHORITY_KEYPAIR"

      - name: Discover devnet position candidates
        run: |
          WALLET_ADDRESS="$(node -e "const fs=require('fs'); const {Keypair}=require('@solana/web3.js'); const secret=Uint8Array.from(JSON.parse(fs.readFileSync(process.env.AUTHORITY_KEYPAIR,'utf8'))); console.log(Keypair.fromSecretKey(secret).publicKey.toBase58())")"
          echo "WALLET_ADDRESS=$WALLET_ADDRESS" >> "$GITHUB_ENV"
          node scripts/find-devnet-whirlpool-positions.mjs --wallet "$WALLET_ADDRESS" > /tmp/devnet-positions.json
          POSITION_ADDRESS_CANDIDATES="$(node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/devnet-positions.json','utf8')); const positions=[...new Set((payload.positions||[]).map((entry)=>entry.positionAddress).filter(Boolean))]; if (positions.length===0) { console.error('No devnet whirlpool positions found for wallet'); process.exit(1); } console.log(positions.join(','));")"
          echo "POSITION_ADDRESS_CANDIDATES=$POSITION_ADDRESS_CANDIDATES" >> "$GITHUB_ENV"

      - name: Verify devnet receipt manifest consistency
        run: pnpm receipt:check:devnet

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify receipt program on devnet
        run: |
          PROGRAM_ID="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('deployments/devnet/receipt.json','utf8')); console.log(m.programId)")"
          solana program show "$PROGRAM_ID" --url devnet

      - name: Run devnet e2e harness
        run: pnpm e2e:devnet
